name = "al-store-licence-hub"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "al-store-licence"
database_id = "REPLACE-WITH-D1-ID"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["0 4 * * *"]

[vars]
LICENCE_PRODUCTS = "al-store"
TRIAL_DAYS = "14"
SESSION_HOURS = "8"
LICENCE_CALENDAR_TZ = "Africa/Cairo"

# Secrets (never in git):
#   npx wrangler secret put LICENCE_SIGNING_KEY        # PKCS#8 PEM trial-hub key (trials only)
#   npx wrangler secret put PAID_SIGNING_KEY           # PKCS#8 PEM paid-hub key (owner panel monthly/permanent)
#   # or legacy alias: LICENCE_PAID_SIGNING_KEY (used only when PAID_SIGNING_KEY is not set)
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put OWNER_PASSWORD_HASH   # pbkdf2-sha256:iterations:salt_hex:hash_hex
# Optional Telegram on new request:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
