# Builds the Windows installer Al-Store-Setup-<version>.exe, installs it silently, starts the installed program and checks
# that it serves its pages. Runs on pushes to main (so every merge yields a tested installer artifact), on version tags
# (releases), by hand, and on pushes to the working branches (so a change to the build is proven before it matters).
# See docs/BUILD_AND_RELEASE.md.
name: windows installer
on:
  push:
    branches: [main, 'ccr-**', 'claude/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read  # builds and uploads an artifact only; nothing is published from here
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check the shipped files
        run: python tools/build_windows.py --check
      - name: Power-cut drill on Windows (the program killed while selling and while backing up; data and backups stay whole)
        working-directory: tests
        run: python -m unittest -v test_release.PowerCut test_release.DataSafety
      - name: Build tools
        run: pip install nuitka ordered-set zstandard pillow
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        run: python tools/build_windows.py
      - name: Smoke-test the program folder (before installing)
        run: python tools/smoke_exe.py build/app.dist/Al-Store.exe
      - name: Install silently, then smoke-test the installed program
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/Al-Store-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = Join-Path ${env:ProgramFiles} 'Al-Store\Al-Store.exe'
          if (-not (Test-Path $exe)) { throw 'the installed program is missing' }
          python tools/smoke_exe.py $exe
          if (-not (Test-Path (Join-Path ${env:ProgramData} 'Al-Store'))) { throw 'the data folder was not created' }
      - name: Real shop journey, then update over it (the shop's sale, stock and backup must survive)
        shell: pwsh
        run: |
          pip install cryptography
          $exe = Join-Path ${env:ProgramFiles} 'Al-Store\Al-Store.exe'
          $home2 = Join-Path ${env:RUNNER_TEMP} 'journey-shop'
          python tools/journey_exe.py first $home2 $exe
          if ($LASTEXITCODE -ne 0) { throw 'the first journey failed' }
          $setup = Get-ChildItem dist/Al-Store-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          python tools/journey_exe.py after $home2 $exe
          if ($LASTEXITCODE -ne 0) { throw 'the shop did not survive the update' }
      - name: Release proof (source commit, version, installer checksum, this run)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/Al-Store-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $version = python -c "import sys; sys.path.insert(0, 'server'); import version; print(version.VERSION)"
          $proof = @(
            "product: Al-Store", "version: $version", "source_commit: ${env:GITHUB_SHA}", "ref: ${env:GITHUB_REF}",
            "installer: $($setup.Name)", "installer_sha256: $hash",
            "workflow_run: ${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}/actions/runs/${env:GITHUB_RUN_ID}",
            "checks: program folder smoke, silent install, installed smoke, real shop journey, update keeps data, uninstall keeps data")
          $proof | Set-Content -Encoding utf8 dist/RELEASE-PROOF.txt
          Get-Content dist/RELEASE-PROOF.txt
      - name: Uninstall keeps the shop's data
        shell: pwsh
        run: |
          $unins = Join-Path ${env:ProgramFiles} 'Al-Store\unins000.exe'
          Start-Process -FilePath $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          if (Test-Path (Join-Path ${env:ProgramFiles} 'Al-Store\Al-Store.exe')) { throw 'the program was not removed' }
          if (-not (Test-Path (Join-Path ${env:ProgramData} 'Al-Store'))) { throw 'the shop data folder must survive an uninstall' }
      - uses: actions/upload-artifact@v7
        with:
          name: Al-Store-Setup
          path: |
            dist/Al-Store-Setup-*.exe
            dist/RELEASE-PROOF.txt
          retention-days: 14
